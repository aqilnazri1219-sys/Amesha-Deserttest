<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tempahan Pencuci Mulut</title>
    <style>
        /* SAYA MASUKKAN CSS TERUS DALAM NI SUPAYA TAK KACAU DENGAN FAIL LAIN */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcefe9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            gap: 20px;
        }
        @media (min-width: 768px) {
            body {
                flex-direction: row;
                align-items: flex-start;
            }
        }
        .auth-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #d65a31;
            margin-bottom: 20px;
            margin-top: 0;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input, textarea, select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #d65a31;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #b23b16;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Log Masuk</h2>
        <form id="form-login">
            <input type="email" id="login-email" placeholder="E-mel" required>
            <input type="password" id="login-password" placeholder="Kata Laluan" required>
            <button type="submit">Masuk</button>
        </form>
    </div>

    <div class="auth-container">
        <h2>Daftar Akaun Baru</h2>
        <form id="form-register">
            <input type="text" id="reg-nama" placeholder="Nama Penuh" required>
            <input type="tel" id="reg-telefon" placeholder="Nombor Telefon" required>
            <textarea id="reg-alamat" placeholder="Alamat Penghantaran" rows="3" required></textarea>
            <input type="email" id="reg-email" placeholder="E-mel" required>
            <input type="password" id="reg-password" placeholder="Kata Laluan (Min 6 aksara)" required>
            
            <label for="reg-role">Daftar sebagai:</label>
            <select id="reg-role">
                <option value="customer">Customer (Pelanggan)</option>
                <option value="admin">Admin (Pengurus)</option>
            </select>

            <button type="submit">Daftar</button>
        </form>
    </div>

    </body>
</html>
